name: sovereign_core
description: >
  Shared encrypted-vault engine for the Sovereign Vault app family:
  dual-custody key management, AES-256-GCM/Argon2id crypto, escalating
  lockout, vault storage, and the shared brand theme/widgets. Not
  published — a local path dependency shared between sibling apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/aurora_logo.png
