name: sovereign_vault
description: A local-only, offline-first credential and document vault.
publish_to: 'none'
# Dart's own package version must be full 3-part semver ("1.0" alone is
# invalid here) — App Store Connect's version record was created as "1.0"
# (two-part) and can't be edited, so codemagic.yaml overrides the actual
# native build's version via `flutter build --build-name=1.0` instead of
# relying on this field for that.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/aurora_logo.png
