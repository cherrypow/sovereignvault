workflows:
  macos-release:
    name: Sovereign Vault - macOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: sovereign_vault

    environment:
      groups:
        - "SovVaultApp"
      vars:
        BUNDLE_ID: "com.cherrypow.sovereignvault"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          # This also pulls in sovereign_core via the ../sovereign_core
          # path dependency — Codemagic checks out the whole repo, so
          # that sibling folder is present regardless of working_directory.
          flutter pub get

      - name: Set up code signing
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"

          keychain initialize

          # macOS App Store distribution needs two certificates, unlike
          # iOS's one: an Application cert to sign the .app, and an
          # Installer cert to sign the .pkg that wraps it for submission.
          openssl genrsa -out /tmp/app_cert_key.pem 2048
          openssl genrsa -out /tmp/installer_cert_key.pem 2048

          for cert_type in MAC_APP_DISTRIBUTION MAC_INSTALLER_DISTRIBUTION; do
            app-store-connect certificates list --type "$cert_type" --json > /tmp/certs.json 2>/dev/null || true
            for cert_id in $(python3 -c "import json; [print(c['id']) for c in json.load(open('/tmp/certs.json'))]" 2>/dev/null); do
              echo "Deleting existing $cert_type certificate $cert_id"
              app-store-connect certificates delete "$cert_id" 2>&1 || true
            done
          done

          app-store-connect certificates create \
            --type MAC_APP_DISTRIBUTION \
            --certificate-key "$(cat /tmp/app_cert_key.pem)"

          app-store-connect certificates create \
            --type MAC_INSTALLER_DISTRIBUTION \
            --certificate-key "$(cat /tmp/installer_cert_key.pem)" \
            --save

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_STORE \
            --create \
            --certificate-key "$(cat /tmp/app_cert_key.pem)"

          keychain add-certificates

          # fetch-signing-files saves macOS profiles under Xcode's UserData
          # path, not the legacy ~/Library/MobileDevice path iOS profiles
          # used in the thailang script — check both, newest first.
          PROFILE_PATH=$(ls -t ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.provisionprofile 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.provisionprofile 2>/dev/null | head -1)
          fi
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          fi
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi
          echo "Using profile: $PROFILE_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "Done setting up code signing"

      - name: Build macOS archive
        script: |
          # Deliberately unsigned here — forcing CODE_SIGN_STYLE/
          # PROVISIONING_PROFILE via command-line overrides applies to
          # every target in the build graph, including the Swift Package
          # Manager plugin targets Flutter macOS now generates
          # (connectivity_plus, file_picker, url_launcher_macos, etc.).
          # Those are resource-bundle targets that structurally cannot
          # carry a provisioning profile at all, so a global override
          # breaks the archive. Real distribution signing happens at
          # export time instead (next step), which only touches the
          # already-built Runner.app, not these sub-targets.
          #
          # --config-only runs Flutter's own project-prep work (Generated
          # Xcode config, the FlutterInputs/FlutterOutputs.xcfilelist files
          # the "Flutter Assemble" build phase reads, pod/SPM resolution)
          # without doing a full build — required before a bare xcodebuild
          # archive call, which skips that prep entirely on its own.
          flutter build macos --config-only

          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/macos/Runner.xcarchive \
            -destination 'generic/platform=macOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export pkg
        script: |
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>799FH7B774</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cherrypow.sovereignvault</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/macos/Runner.xcarchive \
            -exportPath build/macos/pkg \
            -exportOptionsPlist exportOptions.plist

      - name: Upload to App Store Connect
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"
          app-store-connect publish \
            --path build/macos/pkg/*.pkg
          echo "Upload complete"

    artifacts:
      - build/macos/pkg/*.pkg
      - build/macos/Runner.xcarchive
      - /tmp/xcodebuild_logs/*.log
