workflows:
  macos-release:
    name: Sovereign Vault - macOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: sovereign_vault

    environment:
      groups:
        - "SovVaultApp"
      vars:
        BUNDLE_ID: "com.cherrypow.sovereignvault"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          # This also pulls in sovereign_core via the ../sovereign_core
          # path dependency — Codemagic checks out the whole repo, so
          # that sibling folder is present regardless of working_directory.
          flutter pub get

      - name: Set up code signing
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"

          keychain initialize

          # macOS App Store distribution needs two certificates, unlike
          # iOS's one: an Application cert to sign the .app, and an
          # Installer cert to sign the .pkg that wraps it for submission.
          openssl genrsa -out /tmp/app_cert_key.pem 2048
          openssl genrsa -out /tmp/installer_cert_key.pem 2048

          # DISTRIBUTION is the newer universal Apple Distribution cert
          # type Apple now issues in place of MAC_APP_DISTRIBUTION on this
          # account (confirmed by the "certificate type: DISTRIBUTION" log
          # line each run) — it has to be cleaned up here too, or it's
          # never deleted and every run leaves one behind until Apple's
          # per-account cert quota is hit and every future create 409s.
          for cert_type in MAC_APP_DISTRIBUTION MAC_INSTALLER_DISTRIBUTION DISTRIBUTION; do
            app-store-connect certificates list --type "$cert_type" --json > /tmp/certs.json 2>/dev/null || true
            for cert_id in $(python3 -c "import json; [print(c['id']) for c in json.load(open('/tmp/certs.json'))]" 2>/dev/null); do
              echo "Deleting existing $cert_type certificate $cert_id"
              app-store-connect certificates delete "$cert_id" 2>&1 || true
            done
          done

          # fetch-signing-files creates the MAC_APP_DISTRIBUTION cert itself
          # (matching this key) as part of resolving the MAC_APP_STORE
          # profile, and reliably lands it in the keychain via
          # `keychain add-certificates` below — confirmed working by an
          # earlier build's export log.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type MAC_APP_STORE \
            --create \
            --certificate-key "$(cat /tmp/app_cert_key.pem)"

          # The Installer cert has no fetch-signing-files equivalent, and
          # routing it through `certificates create --save` +
          # `keychain add-certificates` produced no usable identity last
          # run: the exported archive's provisioning profile listed the
          # Installer cert's hash as required, but only the App cert
          # resolved as an actual signing identity at export time. So its
          # .p12 is built here by hand instead of trusting --save's
          # internal mechanics, and imported directly with `security
          # import` instead of going through `keychain add-certificates`'s
          # auto-discovery, which is what actually broke last run: it was
          # given an empty p12 password to match keychain add-certificates'
          # documented default, but OpenSSL's empty-password PKCS12 MAC and
          # macOS's expectation of "empty" didn't agree — import failed
          # with "MAC verification failed during PKCS12 import". Using an
          # explicit password on both ends of a single `security import`
          # call removes that ambiguity entirely.
          app-store-connect certificates create \
            --type MAC_INSTALLER_DISTRIBUTION \
            --certificate-key "$(cat /tmp/installer_cert_key.pem)" \
            --json > /tmp/installer_cert.json

          python3 -c "import json, base64; d = json.load(open('/tmp/installer_cert.json')); d = d[0] if isinstance(d, list) else d; attrs = d.get('attributes', d); open('/tmp/installer_cert.cer', 'wb').write(base64.b64decode(attrs['certificateContent']))"
          openssl x509 -inform DER -in /tmp/installer_cert.cer -out /tmp/installer_cert.pem

          INSTALLER_P12_PASSWORD="sovvault-ci-$RANDOM"
          openssl pkcs12 -export -legacy \
            -inkey /tmp/installer_cert_key.pem \
            -in /tmp/installer_cert.pem \
            -out /tmp/installer_distribution.p12 \
            -passout pass:"$INSTALLER_P12_PASSWORD" 2>/dev/null || \
          openssl pkcs12 -export \
            -inkey /tmp/installer_cert_key.pem \
            -in /tmp/installer_cert.pem \
            -out /tmp/installer_distribution.p12 \
            -passout pass:"$INSTALLER_P12_PASSWORD"

          BUILD_KEYCHAIN=$(security default-keychain -d user | tr -d ' "')
          echo "Importing Installer cert directly into $BUILD_KEYCHAIN"
          security import /tmp/installer_distribution.p12 \
            -k "$BUILD_KEYCHAIN" \
            -P "$INSTALLER_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security

          # Handles the App cert only now -- the Installer cert was just
          # imported directly above.
          keychain add-certificates

          # fetch-signing-files saves macOS profiles under Xcode's UserData
          # path, not the legacy ~/Library/MobileDevice path iOS profiles
          # used in the thailang script — check both, newest first.
          PROFILE_PATH=$(ls -t ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.provisionprofile 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.provisionprofile 2>/dev/null | head -1)
          fi
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          fi
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profile found!"
            exit 1
          fi
          echo "Using profile: $PROFILE_PATH"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_PATH=$PROFILE_PATH" >> $CM_ENV

          # Certificate display names on this account have already changed
          # once between runs (3rd Party Mac Developer Application ->
          # Apple Distribution, when Apple consolidated cert types), so
          # signing by name later is fragile. Capture each cert's SHA-1
          # hash now and sign by hash instead, which is unambiguous
          # regardless of what Apple decides to call it.
          #
          # -p codesigning matches exactly the App cert here (Installer
          # certs never satisfy that policy, so this can't accidentally
          # grab the wrong one).
          APP_CERT_HASH=$(security find-identity -v -p codesigning | grep -Eo '[A-F0-9]{40}' | head -1)
          echo "App cert hash: $APP_CERT_HASH"
          echo "APP_CERT_HASH=$APP_CERT_HASH" >> $CM_ENV

          INSTALLER_CERT_HASH=$(openssl x509 -in /tmp/installer_cert.pem -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':')
          echo "Installer cert hash: $INSTALLER_CERT_HASH"
          echo "INSTALLER_CERT_HASH=$INSTALLER_CERT_HASH" >> $CM_ENV

          echo "Done setting up code signing"

      - name: Build macOS archive
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"

          # MARKETING_VERSION is pinned to "1.0" in AppInfo.xcconfig (App
          # Store Connect's version record can't be edited to anything
          # else), but CURRENT_PROJECT_VERSION (the build number) still
          # has to be unique per upload — otherwise App Store Connect
          # rejects the .pkg with "The provided entity includes an
          # attribute with a value that has already been used", since the
          # xcconfig's hardcoded "1" never changes between runs. Every
          # build number ever accepted (even for an expired/deleted
          # TestFlight build) is permanently reserved by Apple and can
          # never be reused, so this has to climb monotonically forever.
          #
          # get-latest-build-number takes the app's numeric App Store
          # Connect resource ID, not its bundle ID -- an earlier attempt
          # at this passed BUNDLE_ID directly, which failed, silently
          # fell through a "|| echo 0" fallback, and regressed to build 1
          # again. Resolve the resource ID from the bundle ID first via
          # `apps list`, and fail loudly on any step here instead of
          # falling back to a default that would reproduce that bug a
          # third time with no signal in the logs.
          APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json | python3 -c "import json, sys; print(json.load(sys.stdin)[0]['id'])")
          if [ -z "$APPLE_ID" ]; then
            echo "ERROR: could not resolve App Store Connect app id for bundle id $BUNDLE_ID"
            exit 1
          fi
          echo "App Store Connect app id for $BUNDLE_ID: $APPLE_ID"

          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APPLE_ID" --platform MAC_OS)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            echo "ERROR: could not determine latest build number from App Store Connect"
            exit 1
          fi
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest build number on App Store Connect: $LATEST_BUILD_NUMBER -- using $BUILD_NUMBER"

          # Deliberately unsigned here — forcing CODE_SIGN_STYLE/
          # PROVISIONING_PROFILE via command-line overrides applies to
          # every target in the build graph, including the Swift Package
          # Manager plugin targets Flutter macOS now generates
          # (connectivity_plus, file_picker, url_launcher_macos, etc.).
          # Those are resource-bundle targets that structurally cannot
          # carry a provisioning profile at all, so a global override
          # breaks the archive. Real distribution signing happens at
          # export time instead (next step), which only touches the
          # already-built Runner.app, not these sub-targets.
          #
          # --config-only runs Flutter's own project-prep work (Generated
          # Xcode config, the FlutterInputs/FlutterOutputs.xcfilelist files
          # the "Flutter Assemble" build phase reads, pod/SPM resolution)
          # without doing a full build — required before a bare xcodebuild
          # archive call, which skips that prep entirely on its own.
          flutter build macos --config-only

          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -archivePath build/macos/Runner.xcarchive \
            -destination 'generic/platform=macOS' \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER

      - name: Export pkg
        script: |
          # xcodebuild -exportArchive was silently dropping the app-sandbox
          # entitlement: the archive itself was built with
          # CODE_SIGNING_ALLOWED=NO (deliberately, previous step), so
          # there's no signed binary for export to inherit entitlements
          # from. Its manual-signing re-sign step falls back to only
          # whatever entitlements are baked into the chosen provisioning
          # profile itself (app-identifier/team-identifier/keychain-
          # access-groups) — never the project's Release.entitlements file
          # — so app-sandbox never made it into the uploaded binary and
          # Apple rejected it outright. Signing directly with `codesign
          # --entitlements` and packaging with `productbuild` removes that
          # ambiguity: this is the same two-step process -exportArchive
          # does internally for the app-store-connect method, just made
          # explicit so entitlements are under our control.
          APP_PATH="build/macos/Runner.xcarchive/Products/Applications/sovereign_vault.app"

          echo "Embedding profile: $PROFILE_PATH"
          cp "$PROFILE_PATH" "$APP_PATH/Contents/embedded.provisionprofile"

          # fetch-signing-files writes profiles with restrictive
          # owner-only permissions, which `cp` carries straight into the
          # bundle. productbuild then packages that file as-is, and Apple
          # rejects packages containing files a normal user can't read
          # ("only readable by the root user") since the app can't
          # validate its own signature at runtime otherwise. Must happen
          # before signing so the permissions are part of what gets
          # signed, not patched on after.
          chmod -R a+rX "$APP_PATH"

          # A raw `codesign --entitlements <file>` REPLACES the entitlements
          # entirely — it doesn't merge like Xcode's own automatic signing
          # does. Signing with just our 2-key Release.entitlements dropped
          # application-identifier/team-identifier, which the profile
          # requires be present in the signed binary too (confirmed by
          # Apple's "missing an application identifier" warning last run).
          # Extract the profile's own entitlements dict and merge our
          # project's entitlements into it instead of replacing it.
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist
          python3 -c "import plistlib; profile_ents = plistlib.load(open('/tmp/entitlements.plist', 'rb')); project_ents = plistlib.load(open('macos/Runner/Release.entitlements', 'rb')); profile_ents.update(project_ents); plistlib.dump(profile_ents, open('/tmp/entitlements.plist', 'wb'))"
          echo "--- Merged entitlements to be signed in ---"
          cat /tmp/entitlements.plist

          codesign --force --deep --timestamp \
            --sign "$APP_CERT_HASH" \
            --entitlements /tmp/entitlements.plist \
            "$APP_PATH"

          echo "--- Verifying signature and entitlements ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH"

          mkdir -p build/macos/pkg
          productbuild --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_CERT_HASH" \
            build/macos/pkg/sovereign_vault.pkg

      - name: Upload to App Store Connect
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"
          app-store-connect publish \
            --path build/macos/pkg/*.pkg

    artifacts:
      - build/macos/pkg/*.pkg
      - build/macos/Runner.xcarchive
      - /tmp/xcodebuild_logs/*.log

  macos-opener-direct:
    name: Sovereign Vault Opener - Direct Download
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: sovereign_opener

    environment:
      groups:
        - "SovVaultApp"
      vars:
        BUNDLE_ID: "com.cherrypow.sovereignOpener"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set up Developer ID signing
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"

          keychain initialize

          openssl genrsa -out /tmp/devid_cert_key.pem 2048

          # DEVELOPER_ID_APPLICATION is a different cert type from the
          # Mac App Store ones (MAC_APP_DISTRIBUTION/
          # MAC_INSTALLER_DISTRIBUTION) in the vault's own workflow --
          # it signs apps distributed directly (a website download),
          # not through the store. No provisioning profile is used at
          # all for this distribution method, which is most of why this
          # workflow is so much shorter than the App Store one.
          #
          # The p12 is built by hand and imported directly with
          # `security import`, exactly like the Installer cert in the
          # main app's workflow -- `certificates create --save` +
          # `keychain add-certificates` silently failed for that cert
          # there, so there's no reason to trust it here either.
          app-store-connect certificates list --type DEVELOPER_ID_APPLICATION --json > /tmp/certs.json 2>/dev/null || true
          for cert_id in $(python3 -c "import json; [print(c['id']) for c in json.load(open('/tmp/certs.json'))]" 2>/dev/null); do
            echo "Deleting existing DEVELOPER_ID_APPLICATION certificate $cert_id"
            app-store-connect certificates delete "$cert_id" 2>&1 || true
          done

          app-store-connect certificates create \
            --type DEVELOPER_ID_APPLICATION \
            --certificate-key "$(cat /tmp/devid_cert_key.pem)" \
            --json > /tmp/devid_cert.json

          python3 -c "import json, base64; d = json.load(open('/tmp/devid_cert.json')); d = d[0] if isinstance(d, list) else d; attrs = d.get('attributes', d); open('/tmp/devid_cert.cer', 'wb').write(base64.b64decode(attrs['certificateContent']))"
          openssl x509 -inform DER -in /tmp/devid_cert.cer -out /tmp/devid_cert.pem

          DEVID_P12_PASSWORD="sovopener-ci-$RANDOM"
          openssl pkcs12 -export -legacy \
            -inkey /tmp/devid_cert_key.pem \
            -in /tmp/devid_cert.pem \
            -out /tmp/devid_cert.p12 \
            -passout pass:"$DEVID_P12_PASSWORD" 2>/dev/null || \
          openssl pkcs12 -export \
            -inkey /tmp/devid_cert_key.pem \
            -in /tmp/devid_cert.pem \
            -out /tmp/devid_cert.p12 \
            -passout pass:"$DEVID_P12_PASSWORD"

          BUILD_KEYCHAIN=$(security default-keychain -d user | tr -d ' "')
          security import /tmp/devid_cert.p12 \
            -k "$BUILD_KEYCHAIN" \
            -P "$DEVID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          DEVID_CERT_HASH=$(security find-identity -v -p codesigning | grep -Eo '[A-F0-9]{40}' | head -1)
          echo "Developer ID cert hash: $DEVID_CERT_HASH"
          echo "DEVID_CERT_HASH=$DEVID_CERT_HASH" >> $CM_ENV

      - name: Build and sign app
        script: |
          flutter build macos --release

          APP_PATH="build/macos/Build/Products/Release/sovereign_opener.app"

          echo "--- Identities in keychain ---"
          security find-identity -v

          # --deep signs everything inside (Flutter's engine framework,
          # plugins); --options runtime enables Hardened Runtime, which
          # notarization requires; --timestamp gets a secure timestamp
          # from Apple, also required for notarization.
          codesign --force --deep --timestamp --options runtime \
            --sign "$DEVID_CERT_HASH" \
            "$APP_PATH"

          echo "--- Verifying signature ---"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package as .dmg
        script: |
          APP_PATH="build/macos/Build/Products/Release/sovereign_opener.app"
          rm -rf build/macos/dmg
          mkdir -p build/macos/dmg
          cp -R "$APP_PATH" build/macos/dmg/
          ln -s /Applications "build/macos/dmg/Applications"

          hdiutil create -volname "Sovereign Vault Opener" \
            -srcfolder build/macos/dmg \
            -ov -format UDZO \
            build/macos/SovereignVaultOpener.dmg

      - name: Notarize and staple
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode)"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8

          xcrun notarytool submit build/macos/SovereignVaultOpener.dmg \
            --key /tmp/asc_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple build/macos/SovereignVaultOpener.dmg

    artifacts:
      - build/macos/SovereignVaultOpener.dmg
