workflows:
  sovereign-vault-macos:
    name: Sovereign Vault - macOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: sovereign_vault

    integrations:
      # This name must exactly match an App Store Connect integration you
      # create in Codemagic under Team settings > Integrations > App Store
      # Connect (upload your App Store Connect API key there and name the
      # integration "sovereign_vault_asc"). This single integration covers
      # both automatic code signing below and the publishing step at the
      # bottom of this file.
      app_store_connect: sovereign_vault_asc

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          # This also pulls in sovereign_core via the ../sovereign_core
          # path dependency — Codemagic checks out the whole repo, so
          # that sibling folder is present regardless of working_directory.
          flutter pub get

      - name: Set up automatic code signing
        script: |
          xcode-project use-profiles

      - name: Build macOS app
        script: |
          # Version comes from MARKETING_VERSION/CURRENT_PROJECT_VERSION
          # in macos/Runner/Configs/AppInfo.xcconfig, not from Flutter's
          # --build-name — that flag also enforces 3-part semver and
          # silently coerces "1.0" to "1.0.0", which doesn't match App
          # Store Connect's version record here.
          flutter build macos --release

    artifacts:
      - sovereign_vault/build/macos/Build/Products/Release/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
