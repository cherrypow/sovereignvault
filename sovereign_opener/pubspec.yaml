name: sovereign_opener
description: >
  Free companion app for opening Sovereign Vault sealed files. Decrypts
  a .svlt file with its PIN and saves the contents to a folder you
  choose — no Sovereign Vault purchase or account required.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  sovereign_core:
    path: ../sovereign_core
  cryptography: ^2.7.0
  file_picker: ^8.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
